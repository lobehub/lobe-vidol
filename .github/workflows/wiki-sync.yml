name: Wiki Sync

on:
  workflow_dispatch:
  push:
    paths:
      - 'contributing/**'
    branches:
      - main

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    name: Wiki sync
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.LOBEHUB_BOT_APP_ID }}
          private-key: ${{ secrets.LOBEHUB_BOT_APP_PRIVATE_KEY }}
      - uses: OrlovM/Wiki-Action@v1
        with:
          path: 'contributing'
          token: ${{ steps.app-token.outputs.token }}
